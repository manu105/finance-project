spring.datasource.url=jdbc:mysql://${MYSQL_HOST:db}:${MYSQL_PORT:3306}/${MYSQL_DB:finance}
spring.datasource.username=${MYSQL_USER:finance}
spring.datasource.password=${MYSQL_PASSWORD:financepass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET:change-me-in-prod-change-me-in-prod}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

server.port=8080
